manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: simonliu-ai-product/simon-nb
    source: https://github.com/simonliu-ai-product/simon-nb
    branch: main
    commit: "129750f3"
    scope: [adk-agent/nano-banana-agent/agent.py, cli_tools/main.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:40:32Z'
    url: https://a2as.org/certified/agents/simonliu-ai-product/simon-nb
  signatures:
    digest: sha256:R0Bus55_RGcLJuSAFXt-sH6G5M4LLUr6-K9SCOu11_A
    key: ed25519:42fDodEOPsVd6oxiA7hxADMQkjAFKPQ5giocTH6eBu8
    sig: ed25519:mCVPLv1qfJPSfAeqv8umEcui6wLLWhhmyqjMQz9YFEcM3OENG6n-Wrq7RHnkLEJY21l3V7zNWZWeKyw9kf6LAA

agents:
  root_agent:
    type: instance
    models: [gemini-2.0-flash]
    tools: [generate_nano_banana]
    params:
      name: NanoBananaAgent
      description: 專門處理影像編輯與生成的代理，透過 Nano Banana 工具依照使用者指令修改或生成圖片。

models:
  gemini-2.0-flash:
    type: literal
    agents: [root_agent]

tools:
  generate_nano_banana:
    type: function
    agents: [root_agent]

imports:
  agent: agent
  Agent: google.adk.agents.Agent
  argparse: argparse
  base64: base64
  genai: google.genai
  json: json
  os: os
  requests: requests
  types: google.genai.types
  uuid: uuid

functions:
  find_project_root:
    type: sync
    module: cli_tools.main
    args: [marker]
  generate_nano_banana:
    type: sync
    module: adk-agent.nano-banana-agent.agent
    args: [image_path, user_feature]
  main:
    type: sync
    module: cli_tools.main

variables:
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv, genai.Client]
      path: [adk-agent.nano-banana-agent.agent]
  GOOGLE_CLOUD_PROJECT:
    type: env
    params:
      caller: [os.getenv]
      path: [adk-agent.nano-banana-agent.agent]
  GOOGLE_GENAI_USE_VERTEXAI:
    type: env
    params:
      caller: [os.getenv]
      path: [adk-agent.nano-banana-agent.agent]

files:
  image_filepath:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  image_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, open]
  path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.dirname]
  result_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs]

networks:
  "127.0.0.1":
    type: api
    actions: [POST]
    urls: [/upload/, /apps/nano-banana-agent/users/simon/sessions]
    protocols: [http]
    ports: ["8000", "8787"]
    params:
      caller: [main]
  localhost:
    type: api
    actions: [POST]
    urls: [/run_sse]
    protocols: [http]
    ports: ["8787"]
    params:
      caller: [main]
